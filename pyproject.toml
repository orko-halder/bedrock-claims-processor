[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, SIM: simplify, C4: comprehensions
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# test/eval script mutates sys.path before importing project modules
"tests/*" = ["E402"]
